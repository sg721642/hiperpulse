services:
  - type: web
    name: hiperpulse
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: DEMO_TOKEN
        value: hiperpulse
      - key: GEMINI_API_KEY
        sync: false
