# DigitalOcean App Platform Specification for HiperPulse
# Reference template. Never commit live secrets or API keys.
name: hiperpulse
region: nyc
services:
  - name: hiperpulse-web
    github:
      repo: sg721642/hiperpulse
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 20
      timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
        scope: RUN_TIME
      - key: GEMINI_API_KEY
        type: SECRET
        scope: RUN_TIME
      - key: DEMO_TOKEN
        type: SECRET
        scope: RUN_TIME
